# Cover + social preview for this repo. Regenerate from the repo root:
#   py -3 ..\rfs-brand\tools\make-cover.py docs\assets\cover.toml
# Layout v2 (BRAND.md section 7): name, rule, the README one-liner, and one panel.
name        = "agent-toolkit"
description = "Pinned installers and config for my coding setup"   # README line 1

# The moment that matters: the install script, three of its own "==" lines,
# and its last line. The command types on load and the lines print.
[panel]
kind  = "terminal"
title = "pwsh"
lines = [
  "$ .\\scripts\\install-windows.ps1",
  "== Installing T3 Code",
  "== Installing Claude Code CLI",
  "== Restoring Playwright browsers",
  "ok done. open a new terminal",
]
