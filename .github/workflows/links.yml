name: links

# Links in the README, the repo's own docs and the project page. docs/reference is T3 Code's
# documentation, copied in by the release workflow, so its links are T3's to keep. Monthly as
# well, because the pages they point at move without this repo changing.
on:
  push:
    branches: [main]
    paths: ['**.md', 'docs/*.html']
  schedule:
    - cron: '23 6 4 * *'
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 4 --retry-wait-time 10 --timeout 30
            --accept 200,206,429
            --exclude-path docs/reference
            './*.md' 'config/*.md' 'docs/*.md' 'docs/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
