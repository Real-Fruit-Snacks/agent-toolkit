name: weekly release

on:
  schedule:
    - cron: '0 8 * * 0'        # Sundays 08:00 UTC
  workflow_dispatch:
    inputs:
      t3_tag:
        description: T3 Code release tag (blank = newest nightly)
        required: false
      claude_version:
        description: Claude Code version (blank = latest)
        required: false
      reuse_run_id:
        description: Reuse the collect and distro artifacts of an earlier run id (skips the rebuild, publishes only)
        required: false
      publish:
        description: Publish the release (false leaves it as a draft)
        type: boolean
        default: true

permissions:
  contents: write
  actions: read      # download artifacts from an earlier run when reuse_run_id is set

concurrency:
  group: weekly-release
  cancel-in-progress: false

env:
  # With a RELEASE_TOKEN secret (a fine-grained PAT with contents: write on this repo) the
  # release and its tag are created by the token's owner. Without it, the release author is
  # github-actions[bot]; commits are always made under the identity below.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
  GIT_AUTHOR_NAME: Real-Fruit-Snacks
  GIT_AUTHOR_EMAIL: 87195021+Real-Fruit-Snacks@users.noreply.github.com
  GIT_COMMITTER_NAME: Real-Fruit-Snacks
  GIT_COMMITTER_EMAIL: 87195021+Real-Fruit-Snacks@users.noreply.github.com

jobs:
  collect:
    name: collect (windows)
    if: ${{ !inputs.reuse_run_id }}
    runs-on: windows-latest
    outputs:
      t3_tag: ${{ steps.vers.outputs.t3_tag }}
      claude_version: ${{ steps.vers.outputs.claude_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: collect
        shell: pwsh
        run: |
          $a = @()
          if ('${{ inputs.t3_tag }}')         { $a += @('-T3Tag', '${{ inputs.t3_tag }}') }
          if ('${{ inputs.claude_version }}') { $a += @('-ClaudeVersion', '${{ inputs.claude_version }}') }
          .\scripts\collect.ps1 @a

      - name: record versions
        id: vers
        shell: pwsh
        run: |
          $t3 = (Get-ChildItem windows -Filter 'T3-Code-*-x64.exe').Name -replace '^T3-Code-(.+)-x64\.exe$', 'v$1'
          $cc = Get-Content windows\claude-code\VERSION -Raw
          "t3_tag=$t3"        >> $env:GITHUB_OUTPUT
          "claude_version=$cc" >> $env:GITHUB_OUTPUT

      - name: upload layout
        uses: actions/upload-artifact@v4
        with:
          name: layout
          retention-days: 2
          compression-level: 0
          include-hidden-files: true
          path: |
            windows
            linux
            wsl
            caches
            docs/reference
            VERSIONS.md

  distro:
    name: distro (ubuntu chroot)
    needs: collect
    if: ${{ !inputs.reuse_run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layout
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }   # Ubuntu noble's python3, so the wheels match the image
      - name: complete the Linux wheelhouse natively
        run: |
          W=caches/pip-wheelhouse/linux; mkdir -p "$W"; before=$(ls "$W" | wc -l)
          python -m pip install --quiet --upgrade pip wheel
          python -m pip wheel --quiet --wheel-dir "$W" -r caches/pip-wheelhouse/requirements.txt || echo "::warning::skill wheel build had errors"
          grep -vE '^\s*(#|$)' caches/pip-wheelhouse/requirements-mcp.txt | while read -r pkg; do
            python -m pip wheel --quiet --wheel-dir "$W" "$pkg" >/tmp/wh.log 2>&1 || echo "::warning::no Linux wheel set for $pkg: $(tail -1 /tmp/wh.log)"
          done
          echo "linux wheelhouse: $before -> $(ls "$W" | wc -l) files"
      - name: build distro
        run: |
          chmod +x scripts/*.sh
          sudo -E bash scripts/build-distro-chroot.sh dev
      - name: smoke test inside the image
        run: |
          mkdir -p /tmp/chk && sudo tar -xzf wsl/ubuntu-dev.tar.gz -C /tmp/chk
          sudo test -f /tmp/chk/etc/wsl.conf
          sudo test -d /tmp/chk/home/dev/.claude/skills/docx
          sudo test -f /tmp/chk/home/dev/.claude/skills/full-send/SKILL.md
          for s in killer-design killer-repo killer-council; do sudo test -f /tmp/chk/home/dev/.claude/skills/$s/SKILL.md; done
          sudo test -f /tmp/chk/home/dev/.cache/killer-skills-fonts/fonts.json
          sudo ls /tmp/chk/home/dev/.local/share/claude/versions/
          # what the provisioner registered, read from the image's own config
          sudo python3 - <<'PY'
          import json, os, sys
          h = '/tmp/chk/home/dev'
          cj = json.load(open(f'{h}/.claude.json'))
          assert cj.get('hasCompletedOnboarding') is True, 'onboarding seed not merged'
          mcp = sorted(cj.get('mcpServers', {}))
          print('MCP servers registered:', len(mcp), mcp)
          for want in ('playwright', 'memory', 'sequential-thinking', 'desktop-commander', 'fetch', 'markitdown'):
              assert want in mcp, f'default MCP server missing: {want}'
          venvs = sorted(os.listdir(f'{h}/.venv-mcp')) if os.path.isdir(f'{h}/.venv-mcp') else []
          print('python MCP venvs:', len(venvs), venvs)
          assert len(venvs) >= 10, 'too few Python MCP servers'
          st = json.load(open(f'{h}/.claude/settings.json'))
          en = sorted(k for k, v in st.get('enabledPlugins', {}).items() if v)
          print('plugins enabled:', len(en), en)
          assert len(en) >= 12, 'too few plugins enabled'
          assert len(st.get('extraKnownMarketplaces', {})) >= 7 or os.path.isdir(f'{h}/.claude-toolkit/marketplaces'), 'marketplaces not registered'
          for b in ('github-mcp-server', 'mcp-grafana', 'rust-analyzer'):
              assert os.path.exists(f'{h}/.local/bin/{b}'), f'missing binary {b}'
          print('image OK')
          PY
          sudo rm -rf /tmp/chk
      - uses: actions/upload-artifact@v4
        with:
          name: distro
          retention-days: 2
          compression-level: 0
          include-hidden-files: true
          path: |
            wsl/ubuntu-dev.tar.gz
            caches/playwright-browsers-linux
            caches/t3-tools-linux
            caches/pip-wheelhouse/linux

  publish:
    name: package, verify, publish (windows)
    needs: [collect, distro]
    # runs after a successful build, or on its own when reusing an earlier run's artifacts
    if: ${{ always() && (inputs.reuse_run_id || (needs.collect.result == 'success' && needs.distro.result == 'success')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          name: layout
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: distro
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: smoke test binaries
        shell: pwsh
        run: |
          $zip = Get-ChildItem windows -Filter 't3-*-win32-x64.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $env:TEMP\t3chk -Force
          $t3 = Get-ChildItem $env:TEMP\t3chk -Recurse -Filter t3.exe | Select-Object -First 1
          & $t3.FullName --version
          $cc = Get-ChildItem windows\claude-code -Filter 'claude-*-win32-x64.exe' | Select-Object -First 1
          & $cc.FullName --version
          .\scripts\check-pins.ps1

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }   # for write-page.py and make-plan.py below; the install brings its own Python
      - name: install as a standard user, then check it from that account
        shell: powershell   # Windows PowerShell 5.1, the shell every standard user has
        run: |
          # The kit is for people who can't be administrators, so the smoke test runs as one: a new
          # local account in Users only runs the whole install, apps included, then check-install.ps1,
          # in Windows PowerShell 5.1. The logs are what it printed; the page and README show them
          # once the release is published.
          $user = 'atk-user'
          $pw = 'Atk-' + [guid]::NewGuid().ToString('N') + '!9'
          Write-Host "::add-mask::$pw"
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires -UserMayNotChangePassword -Description 'agent-toolkit smoke test' | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          if (Get-LocalGroupMember -SID 'S-1-5-32-544' | Where-Object { $_.Name -like "*\$user" }) { throw "$user is an administrator" }
          $cred = New-Object System.Management.Automation.PSCredential($user, (ConvertTo-SecureString $pw -AsPlainText -Force))
          $sid = (New-Object Security.Principal.NTAccount $user).Translate([Security.Principal.SecurityIdentifier]).Value

          # read access to the checkout and its restored layout; a folder of its own for the logs
          $ws = $env:GITHUB_WORKSPACE
          $run = 'C:\atk-run'
          New-Item -ItemType Directory -Force -Path $run | Out-Null
          foreach ($g in @(@($ws, 'RX'), @($run, 'M'))) {
            icacls $g[0] /grant "${user}:(OI)(CI)$($g[1])" /Q | Out-Null
            if ($LASTEXITCODE) { throw "icacls $($g[0]) failed: $LASTEXITCODE" }
          }

          # A plain user on Windows Server can't sign in as a batch job (a scheduled task with a
          # password) or interactively (Start-Process -Credential); grant this account both.
          secedit /export /areas USER_RIGHTS /cfg "$run\rights.inf" | Out-Null
          $inf = @(Get-Content "$run\rights.inf")
          foreach ($right in 'SeBatchLogonRight', 'SeInteractiveLogonRight') {
            if ($inf -match "^$right\s*=") { $inf = $inf -replace "^($right\s*=.*)$", "`$1,*$sid" }
            else { $inf = $inf -replace '^\[Privilege Rights\]$', "[Privilege Rights]`r`n$right = *$sid" }
          }
          Set-Content "$run\rights.inf" $inf -Encoding Unicode
          secedit /configure /db "$run\rights.sdb" /cfg "$run\rights.inf" /areas USER_RIGHTS /quiet | Out-Null
          wevtutil set-log Microsoft-Windows-TaskScheduler/Operational /enabled:true

          # The scripts run under as-user.ps1, which gives them the environment a fresh sign-in as this
          # account has, whatever launched it: Start-Process -Credential hands down the launcher's.
          # The profile comes from the token's SID, since known-folder lookups expand the inherited
          # variables; the AppData folders from this account's own User Shell Folders.
          @'
          param([string]$What, [string]$Repo)
          $ErrorActionPreference = 'Stop'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $env:USERPROFILE = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath)
          $usf = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders' -ErrorAction SilentlyContinue
          function Folder($Name, $Default) { $v = if ($usf -and $usf.$Name) { $usf.$Name } else { $Default }; [Environment]::ExpandEnvironmentVariables($v) }
          $env:APPDATA = Folder 'AppData' "$env:USERPROFILE\AppData\Roaming"
          $env:LOCALAPPDATA = Folder 'Local AppData' "$env:USERPROFILE\AppData\Local"
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'; $env:TMP = $env:TEMP
          $env:HOMEDRIVE = Split-Path -Qualifier $env:USERPROFILE; $env:HOMEPATH = Split-Path -NoQualifier $env:USERPROFILE
          $env:USERNAME = [Environment]::UserName
          . (Join-Path $Repo 'scripts\common.ps1')
          Import-NewTerminalEnvironment
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          switch ($What) {
            'probe'   { "user=$([Security.Principal.WindowsIdentity]::GetCurrent().Name) profile=$env:USERPROFILE localappdata=$env:LOCALAPPDATA elevated=$(Test-Elevated)"; exit 0 }
            'install' { & (Join-Path $Repo 'scripts\install-windows.ps1'); exit $LASTEXITCODE }
            'check'   { & (Join-Path $Repo 'scripts\check-install.ps1') -StandardUser -MaxProfileMB 1024 -Offline; exit $LASTEXITCODE }
          }
          '@ -replace '(?m)^          ', '' | Set-Content "$run\as-user.ps1" -Encoding ascii

          # cmd's own redirection, so the logs hold exactly what a console would show, native output included.
          # check-install.ps1 -MaxProfileMB: what a roaming profile would copy at every logon stays small (VDI).
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $as = "`"$ps`" -NoProfile -ExecutionPolicy Bypass -File $run\as-user.ps1"
          @('@echo off', "cd /d `"$ws`"", "$as probe `"$ws`" > $run\probe.log 2>&1", "> $run\probe.exit echo %ERRORLEVEL%") | Set-Content "$run\probe.cmd" -Encoding ascii
          @('@echo off', "cd /d `"$ws`"",
            "$as install `"$ws`" > $run\install.log 2>&1", "> $run\install.exit echo %ERRORLEVEL%",
            "$as check `"$ws`" > $run\check.log 2>&1", "> $run\check.exit echo %ERRORLEVEL%") | Set-Content "$run\run.cmd" -Encoding ascii

          function Start-AsTask([string]$Cmd, [string]$Done, [int]$Minutes) {
            $name = 'atk-' + [IO.Path]::GetFileNameWithoutExtension($Cmd)
            $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\cmd.exe" -Argument "/d /c $Cmd" -WorkingDirectory $run
            $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes ($Minutes + 5)) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            Register-ScheduledTask -TaskName $name -Action $action -Settings $settings -User $user -Password $pw -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName $name
            $deadline = (Get-Date).AddMinutes($Minutes); $startBy = (Get-Date).AddMinutes(3)
            while (-not (Test-Path $Done) -and (Get-Date) -lt $deadline) {
              Start-Sleep 10
              $info = Get-ScheduledTaskInfo -TaskName $name
              # 0x41303: not run yet; 0x41301: running. Not started after 3 minutes, or idle with any
              # other result, means it isn't going to finish.
              if ($info.LastTaskResult -eq 0x41303 -and (Get-Date) -gt $startBy) { Write-Host '  the task never started'; break }
              if ((Get-ScheduledTask -TaskName $name).State -eq 'Ready' -and $info.LastTaskResult -notin 0x41301, 0x41303 -and -not (Test-Path $Done)) { Start-Sleep 5; break }
            }
            $info = Get-ScheduledTaskInfo -TaskName $name
            Write-Host ("  task {0}: last result 0x{1:x}, last run {2}" -f $name, $info.LastTaskResult, $info.LastRunTime)
            Unregister-ScheduledTask -TaskName $name -Confirm:$false
            return (Test-Path $Done)
          }
          function Start-AsProcess([string]$Cmd, [string]$Done, [int]$Minutes) {
            try {
              $p = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList '/d', '/c', $Cmd -Credential $cred -LoadUserProfile -WorkingDirectory $run -PassThru
              if (-not $p.WaitForExit($Minutes * 60000)) { Write-Host "  still running after $Minutes minutes"; try { $p.Kill() } catch {} }
            } catch { Write-Host "  Start-Process -Credential failed: $($_.Exception.Message)" }
            return (Test-Path $Done)
          }
          function Show-Why {
            Write-Host '  -- Task Scheduler events'
            Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue | ForEach-Object { "    $($_.TimeCreated.ToString('HH:mm:ss')) $($_.Id) $(($_.Message -replace '\s+', ' ').Substring(0, [math]::Min(220, ($_.Message -replace '\s+', ' ').Length)))" }
            Write-Host '  -- failed sign-ins'
            Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4625 } -MaxEvents 5 -ErrorAction SilentlyContinue | ForEach-Object { "    $($_.TimeCreated.ToString('HH:mm:ss')) $((@($_.Message -split "`r?`n" | Where-Object { $_ -match 'Account Name|Logon Type|Failure Reason|Status' }) | ForEach-Object { $_.Trim() }) -join ' | ')" }
            Write-Host '  -- sign-in rights now'
            secedit /export /areas USER_RIGHTS /cfg "$run\now.inf" | Out-Null
            Get-Content "$run\now.inf" | Where-Object { $_ -match 'SeBatchLogonRight|SeInteractiveLogonRight|SeDeny' } | ForEach-Object { "    $_" }
          }

          # A ten-second probe first, so a launch that can't work fails in minutes, with the reason.
          $method = $null
          Write-Host "== probe: a scheduled task as $user"
          if (Start-AsTask "$run\probe.cmd" "$run\probe.exit" 4) { $method = 'task' }
          else {
            Show-Why
            Write-Host "== probe: Start-Process -Credential as $user"
            if (Start-AsProcess "$run\probe.cmd" "$run\probe.exit" 4) { $method = 'process' } else { Show-Why }
          }
          Get-Content "$run\probe.log" -ErrorAction SilentlyContinue
          if (-not $method) { throw "neither a scheduled task nor Start-Process -Credential could run anything as $user" }
          if (-not (Select-String -Path "$run\probe.log" -SimpleMatch "\$user " -Quiet) -or (Select-String -Path "$run\probe.log" -SimpleMatch 'elevated=True' -Quiet)) { throw "the probe didn't run as $user, unelevated" }

          Write-Host "== install, as $user, through $(if ($method -eq 'task') { 'a scheduled task' } else { 'Start-Process -Credential' })"
          if ($method -eq 'task') { [void](Start-AsTask "$run\run.cmd" "$run\check.exit" 80) } else { [void](Start-AsProcess "$run\run.cmd" "$run\check.exit" 80) }
          Write-Host "== install-windows.ps1, as $user"
          Get-Content "$run\install.log" -ErrorAction SilentlyContinue
          Write-Host "== check-install.ps1, as $user"
          Get-Content "$run\check.log" -ErrorAction SilentlyContinue
          Copy-Item "$run\install.log", "$run\check.log" $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          $ie = "$(Get-Content "$run\install.exit" -ErrorAction SilentlyContinue)".Trim()
          $ce = "$(Get-Content "$run\check.exit" -ErrorAction SilentlyContinue)".Trim()
          if (-not $ce) { Show-Why; throw "the install as $user didn't finish" }
          if ($ie -ne '0') { throw "install-windows.ps1 exited $ie as $user" }
          if ($ce -ne '0') { throw "check-install.ps1 exited $ce as $user" }

      - name: next version
        id: ver
        shell: pwsh
        run: |
          $last = gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName'
          if ($last -match '^v(\d+)\.(\d+)\.(\d+)$') { $next = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)" } else { $next = 'v1.0.0' }
          "tag=$next" >> $env:GITHUB_OUTPUT
          Write-Host "last=$last next=$next"

      - name: versions + commit
        shell: pwsh
        run: |
          .\scripts\write-versions.ps1
          git add VERSIONS.md docs/reference
          if (git diff --cached --quiet) { Write-Host 'no manifest changes' } else {
            $t3 = (Get-ChildItem windows -Filter 'T3-Code-*-x64.exe' | Select-Object -First 1).Name -replace '^T3-Code-(.+)-x64\.exe$', '$1'
          $cc = (Get-Content windows\claude-code\VERSION -Raw).Trim()
          git commit -m "Weekly release ${{ steps.ver.outputs.tag }}: T3 $t3, Claude Code $cc"
            git push origin HEAD:main
          }
          git tag -f ${{ steps.ver.outputs.tag }}
          git push -f origin ${{ steps.ver.outputs.tag }}

      - name: package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Tag ${{ steps.ver.outputs.tag }} -Move

      - name: release notes
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $pins = (Get-Content VERSIONS.md | Select-String -Pattern '^\| (T3 Code \(Windows installer\)|Claude Code \(Windows\)|Node\.js \(Windows zip\)|Git for Windows \(portable\)|GitHub CLI \(Windows zip\)|PowerShell 7 \(Windows zip\)|Python \(Windows NuGet\)|WSL platform) \| ([^|]+) \|' -AllMatches).Matches | ForEach-Object { "- $($_.Groups[1].Value -replace ' \(.*\)','') $($_.Groups[2].Value.Trim())" }
          @(
            "Weekly build. T3 Code, the Claude Code CLI and the tools around them for Windows, installed into your own account with no admin rights: from a normal PowerShell, run download-release.ps1, unpack-release.ps1 and install-windows.ps1. The README has the steps and where everything goes.",
            "",
            "Before this was published, the whole install, apps included, ran as a new account with no admin rights on a clean Windows runner, in Windows PowerShell 5.1, and check-install.ps1 passed as that account.",
            "",
            "This release pins:",
            "",
            $pins,
            "",
            "The Windows apps come as zips (Node, the GitHub CLI, PowerShell 7), the portable Git for Windows and Python's NuGet build, plus T3 Code's per-user installer. They, the MCP servers and the caches all go in one folder, %LOCALAPPDATA%\Programs\agent-toolkit unless install-windows.ps1 -Root picks another.",
            "",
            "On VDI desktops: download-release.ps1 fetches only the Windows assets by default (about 4 GB; -Include wsl, -Include linux or -All for the rest) and checks for disk space first, unpack-release.ps1 -Move keeps the release from taking the space twice, and nothing points back at it after the install. The install keeps its weight out of the parts of the profile a roaming profile copies at every logon, and the smoke test fails if more than 1 GB lands there. On a desktop that doesn't keep AppData\Local between sessions, install with -Root on a drive that does; check-install.ps1 says what kind of profile it sees. Several people can install on one multi-session host. WSL 2 needs virtualization that most VDI hosts don't pass through, and setup-wsl.ps1 says so when it can't start; the Windows install doesn't need it.",
            "",
            "page--agent-toolkit-$tag.zip is this release's project page, uploaded once the release is published, to read offline: unpack-release.ps1 puts it in page\.",
            "",
            "Also included: the public Claude Code skills set with a Python wheelhouse, the tstack skills and my killer-skills (killer-design, killer-repo, killer-council) with their runtime and font pack, a seeded npm cache, Claude Code and T3 Code docs as markdown, Linux copies of the browser and tool caches, and a provisioned Ubuntu distro for WSL.",
            "",
            "Every file and its SHA256 is in VERSIONS.md and SHA256SUMS.txt. Built by the weekly-release workflow."
          ) | Set-Content release-notes.md

      - name: create draft and upload
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $existing = gh release view $tag --json isDraft -q .isDraft 2>$null
          if ($existing -eq 'true') { Write-Host "replacing earlier draft $tag"; gh release delete $tag --yes --cleanup-tag }
          elseif ($existing -eq 'false') { throw "release $tag is already published" }
          gh release create $tag --draft --title $tag --notes-file release-notes.md
          Get-ChildItem release -File | ForEach-Object {
            $ok = $false
            for ($t = 1; $t -le 4 -and -not $ok; $t++) {
              gh release upload $tag $_.FullName --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep 15 }
            }
            if (-not $ok) { throw "upload failed: $($_.Name)" }
          }

      - name: verify
        shell: pwsh
        run: .\scripts\verify-release.ps1 -Tag ${{ steps.ver.outputs.tag }} -Local

      - name: publish
        if: ${{ github.event_name == 'schedule' || inputs.publish }}   # a schedule has no inputs, and an empty one compares equal to false
        shell: pwsh
        run: gh release edit ${{ steps.ver.outputs.tag }} --draft=false

      - name: regenerate cover + page table
        if: ${{ github.event_name == 'schedule' || inputs.publish }}   # a schedule has no inputs, and an empty one compares equal to false
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          (Get-Content docs/index.html -Raw) -replace '<h2>Pinned in v[0-9.]+</h2>', "<h2>Pinned in $tag</h2>" | Set-Content docs/index.html -NoNewline
          # the published release's assets, sizes and digests, plus VERSIONS.md, onto the page and the README's load plan
          # with the standard user's logs from the smoke test, onto the page and into the README
          python scripts/write-page.py --tag $tag --log "$env:RUNNER_TEMP\install.log" --check "$env:RUNNER_TEMP\check.log"
          if ($LASTEXITCODE) { throw 'write-page.py failed' }
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-plan.py
          if ($LASTEXITCODE) { throw 'make-plan.py failed' }

          # The page as just written for this release, on the release itself, to read offline (a VDI
          # desktop may not reach github.io). It can't be in SHA256SUMS.txt, which is fixed before
          # the page exists; verify-release.ps1 checks it has the digest GitHub records instead.
          $stage = Join-Path $env:RUNNER_TEMP 'page'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($f in 'index.html', 'styles.css', 'script.js', 'manifest.webmanifest', 'favicon.ico', 'icon.svg', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png', 'apple-touch-icon.png') { Copy-Item (Join-Path docs $f) $stage }
          Copy-Item docs/fonts, docs/assets (Join-Path $stage '.') -Recurse
          $pageZip = Join-Path $env:RUNNER_TEMP "page--agent-toolkit-$tag.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $pageZip -Force
          gh release upload $tag $pageZip --clobber
          if ($LASTEXITCODE) { throw 'page upload failed' }
          .\scripts\verify-release.ps1 -Tag $tag
          if ($LASTEXITCODE) { throw 'the release is no longer consistent with the page on it' }

          git add README.md docs/index.html docs/release.json docs/assets/plan-dark.svg docs/assets/plan-light.svg
          if (-not (git diff --cached --quiet)) {
            git commit -m "Page: point at $tag"
            # main can move during a long run; replay the commit on top before pushing. --autostash
            # sets aside files the downloaded layout left changed in the checkout, which aren't pushed.
            git fetch origin main
            git rebase --autostash FETCH_HEAD
            if ($LASTEXITCODE) { throw "page commit no longer applies on top of main" }
            git push origin HEAD:main
          }
