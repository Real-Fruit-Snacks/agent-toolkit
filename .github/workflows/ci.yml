name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  page:
    # The release facts and the smoke test's log on the project page, and the README's log and load plan, are
    # generated from docs/release.json. Fail if the committed files no longer match what scripts/write-page.py
    # and docs/art/make-plan.py write.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate the page blocks and the load plan
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python scripts/write-page.py
          python docs/art/make-plan.py
          git diff --exit-code -- README.md docs/index.html docs/assets/plan-dark.svg docs/assets/plan-light.svg

  scripts:
    # Every script in the repo at least parses: PowerShell with its own parser, shell with bash -n, Python with py_compile.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: PowerShell
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in git ls-files '*.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "$f`:$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          Write-Host "$(@(git ls-files '*.ps1').Count) PowerShell scripts, $bad parse error(s)"
          if ($bad) { exit 1 }
      - name: shell and Python
        run: |
          git ls-files '*.sh' | xargs -n1 bash -n
          git ls-files '*.py' | xargs python3 -m py_compile
          echo "$(git ls-files '*.sh' | wc -l) shell and $(git ls-files '*.py' | wc -l) Python scripts parse"
